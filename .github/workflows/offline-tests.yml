name: Offline gateway checks
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    env:
      CACHE_ENABLED: 'false'
      DEV_MODE: 'true'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-smoke.txt
      - run: python -m pytest tests/test_cache_context.py tests/test_gateway.py -q -k 'not valid_request_schema'
